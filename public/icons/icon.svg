<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#184f95"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25e"/>
      <stop offset="1" stop-color="#eda100"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g id="art">
    <!-- billet qui dépasse -->
    <rect x="150" y="128" width="200" height="110" rx="14" fill="#9fe0c4" transform="rotate(-10 250 183)"/>
    <rect x="132" y="150" width="200" height="100" rx="14" fill="#cdf3e2" transform="rotate(-4 232 200)"/>
    <!-- portefeuille -->
    <rect x="104" y="196" width="304" height="200" rx="34" fill="#ffffff"/>
    <rect x="104" y="196" width="304" height="44" rx="22" fill="#e6effb"/>
    <!-- fermoir -->
    <path d="M300 262 H408 V346 H300 a42 42 0 0 1 0 -84 Z" fill="#d6e5f8"/>
    <!-- pièce -->
    <circle cx="306" cy="304" r="34" fill="url(#coin)" stroke="#ffffff" stroke-width="6"/>
    <text x="306" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="40" fill="#8a5a00">F</text>
  </g>
</svg>
